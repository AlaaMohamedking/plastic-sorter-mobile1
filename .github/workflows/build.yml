name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin pkg-config cmake make gcc g++ zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev

      - name: Install Buildozer
        working-directory: plastic_sorter_mobile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython<3"
          python -m pip install buildozer

      - name: Build APK
        working-directory: plastic_sorter_mobile
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: plastic_sorter_mobile/bin/*.apk
          if-no-files-found: error
